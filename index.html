<style>
/* Layout: phone-first single column, sticky day header, fixed bottom tab bar; macros as P/Y/K rails */
:root{
  --bg:#F3F5F0; --surface:#FFFFFF; --sunk:#E8ECE4; --line:#D6DCD1;
  --fg:#18201B; --muted:#5E6B62; --accent:#2D6A4F; --accent-ink:#FFFFFF; --accent-soft:#DCEBE2;
  --pro:#B4442E; --fat:#C18A12; --carb:#3C6E9E;
  --ok:#2D7A4B; --warn:#B26B00; --bad:#B3261E;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#1A211D; --sunk:#232B26; --line:#2F3832;
  --fg:#E7ECE8; --muted:#97A39B; --accent:#6FC197; --accent-ink:#0D1A13; --accent-soft:#1F3A2C;
  --pro:#E7836C; --fat:#E2B44D; --carb:#7FAEDB; --ok:#6FC197; --warn:#E2B44D; --bad:#F08A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1A211D; --sunk:#232B26; --line:#2F3832;
  --fg:#E7ECE8; --muted:#97A39B; --accent:#6FC197; --accent-ink:#0D1A13; --accent-soft:#1F3A2C;
  --pro:#E7836C; --fat:#E2B44D; --carb:#7FAEDB; --ok:#6FC197; --warn:#E2B44D; --bad:#F08A80; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.gear{border:none;background:transparent;min-height:40px;min-width:40px;padding:0;display:grid;place-items:center;color:var(--muted)}
.gear svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.gear.on{color:var(--accent)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;margin:0;flex:1;min-width:0;text-wrap:balance}
.sync{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.sync.local{color:var(--warn)}
main{display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-weight:600;font-size:18px;margin:6px 0 0;letter-spacing:-.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
button,.btn{font:inherit;font-weight:600;font-size:14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 14px;cursor:pointer;min-height:40px;touch-action:manipulation}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
button.danger{color:var(--bad);border-color:var(--bad);background:transparent}
button.danger.armed{background:var(--bad);color:var(--surface)}
button.sm{min-height:32px;padding:5px 10px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:40px;width:100%;min-width:0}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.macros{display:grid;gap:10px}
.mac{display:grid;grid-template-columns:70px 1fr auto;align-items:center;gap:10px}
.mac .name{font-size:13px;font-weight:600}
.rail{position:relative;height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.rail i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.rail i.plan{opacity:.3}
.mac.p i{background:var(--pro)}.mac.f i{background:var(--fat)}.mac.c i{background:var(--carb)}
.mac .v{font-size:13px;text-align:right;white-space:nowrap}
.pfc{display:flex;gap:10px;font-size:13px;flex-wrap:wrap}
.pfc b{font-weight:600}
.pfc .p b{color:var(--pro)}.pfc .f b{color:var(--fat)}.pfc .c b{color:var(--carb)}
.meal{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.meal.done{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 60%,var(--surface))}
.meal h3{margin:0;font-family:var(--display);font-weight:600;font-size:17px}
.eat{min-width:92px}
.eat.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.daynav{display:flex;align-items:center;gap:6px}
.daynav button{min-width:40px;padding-inline:0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
tfoot td{font-weight:600;border-bottom:none}
.tbl{overflow-x:auto;margin-inline:-4px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;border-radius:0;text-align:left;width:100%;font-weight:400;min-height:52px}
.li:last-child{border-bottom:none}
.li .t{font-weight:600}
.planday{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:start;padding-block:10px;border-bottom:1px solid var(--line)}
.planday:last-child{border-bottom:none}
.planday .d{font-family:var(--display);font-weight:600;padding-top:8px}
.planday .sels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.planday select{font-size:14px;padding:6px 8px;min-height:36px}
.pm{display:flex;flex-direction:column;gap:2px;min-width:0}
.pm>span{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
@media (max-width:560px){.planday .sels{grid-template-columns:1fr}.pm{display:grid;grid-template-columns:64px minmax(0,1fr);align-items:center;gap:8px}}
.offer{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.offer.active{border-color:var(--accent)}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 84px 36px;gap:6px;align-items:center}
.irow .u{grid-column:1/-1;font-size:12px;color:var(--muted);margin-top:-2px}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
nav.tabs button{border:none;background:none;min-height:46px;padding:4px 0;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:8px}
nav.tabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.chart svg{width:100%;height:auto;display:block}
.hint{font-size:13px;color:var(--muted)}
.big{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats>div{display:flex;flex-direction:column;gap:4px}
@media (max-width:380px){.mac{grid-template-columns:58px 1fr auto}.planday{grid-template-columns:40px 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="wrap">
  <header class="top"><h1 id="title">MealFlow</h1><span id="sync" class="sync">Yükleniyor</span><button id="gear" class="gear" data-act="tab" data-t="ayar" aria-label="Ayarlar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></header>
  <main id="main"><div class="empty">Veriler yükleniyor…</div></main>
</div>
<nav class="tabs" id="tabs"></nav>
<div id="toast" class="toast" hidden></div>
<input type="file" id="photo-in" accept="image/*" multiple hidden>
<input type="file" id="restore-in" accept="application/json,.json" hidden>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const r1 = n => Math.round(n * 10) / 10;
const f1 = n => (n == null || isNaN(n)) ? "–" : r1(n).toLocaleString("tr-TR");
const f0 = n => (n == null || isNaN(n)) ? "–" : Math.round(n).toLocaleString("tr-TR");
const tl = n => (n == null || isNaN(n)) ? "–" : "₺" + n.toLocaleString("tr-TR", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const tl0 = n => (n == null || isNaN(n)) ? "–" : "₺" + Math.round(n).toLocaleString("tr-TR");
const num = v => { if (v === "" || v == null) return null; const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? null : n; };
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, "0");
const keyOf = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const fromKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const dayIdx = d => (d.getDay() + 6) % 7; // Pazartesi = 0
const DAYS = ["Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi","Pazar"];
const DAYS3 = ["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];
const MONTHS = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const MEALS = [["b","Kahvaltı"],["l","Öğle"],["d","Akşam"]];
const MEALNAME = {b:"Kahvaltı", l:"Öğle", d:"Akşam"};
const UNITS = {g:"g", ml:"ml", adet:"adet"};

/* ---------- state ---------- */
const COLLS = ["products","recipes","settings","log","weights","lists"];
const S = {products:{}, recipes:{}, settings:{}, log:{}, weights:{}, lists:{}};
const loaded = new Set();
const ui = {tab:"bugun", day:keyOf(new Date()), edit:null, armed:null, cook:null, q:"", adding:null, lists:false, ren:null};
let backend = null, mode = "loading";
const APP_VERSION = "2.0";
const API_MODEL = "claude-sonnet-5-5";
const KEY_STORE = "mealflow-api-key", BACKUP_STORE = "mealflow-last-backup";
const lsGet = k => { try { return localStorage.getItem(k) || ""; } catch(e){ return ""; } };
const lsSet = (k, v) => { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); return true; } catch(e){ return false; } };
const ai = {key:lsGet(KEY_STORE), images:true, maxCount:3};

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }

/* ---------- backends ---------- */
function localBackend(){
  const KEY = "mealflow-data-v1";
  let data = {}; try { data = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e){ data = {}; }
  const subs = {};
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e){ toast("Kaydedilemedi: telefonda yer kalmamış olabilir. Ayarlar'dan yedek al."); } };
  const emit = c => (subs[c] || []).forEach(cb => cb(clone(data[c] || {})));
  return {
    sub(c, cb){ (subs[c] = subs[c] || []).push(cb); setTimeout(() => cb(clone(data[c] || {})), 0); },
    async set(c, id, body){ data[c] = data[c] || {}; data[c][id] = clone(body); persist(); emit(c); },
    async del(c, id){ if (data[c]) delete data[c][id]; persist(); emit(c); },
    dump(){ return clone(data); },
    replaceAll(d){ data = clone(d) || {}; persist(); COLLS.forEach(emit); }
  };
}
function dbBackend(db){
  const chains = {};
  const queue = (k, fn) => (chains[k] = (chains[k] || Promise.resolve()).catch(() => {}).then(fn));
  const fail = e => { console.error(e); toast(e && e.code === "quota_exceeded" ? "Kayıt alanı doldu, eski kayıtları sil." : "Kaydedilemedi, bağlantını kontrol edip tekrar dene."); throw e; };
  return {
    sub(c, cb){
      db.collection(c).onSnapshot(snap => { const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = clone(d.data()); }); cb(o); },
        e => { console.error(e); toast("Veri bağlantısı koptu, sayfayı yenile."); });
    },
    set(c, id, body){ return queue(c + "/" + id, () => db.collection(c).doc(id).set(clone(body))).catch(fail); },
    del(c, id){ return queue(c + "/" + id, () => db.collection(c).doc(id).delete()).catch(fail); }
  };
}
async function save(c, id, body){ S[c][id] = clone(body); schedule(); try { await backend.set(c, id, body); } catch(e){} }
async function remove(c, id){ delete S[c][id]; schedule(); try { await backend.del(c, id); } catch(e){} }

/* ---------- domain math ---------- */
const settings = () => S.settings.main || {targets:{p:170,f:122,c:30}, plan:Array.from({length:7}, () => ({b:"",l:"",d:""})), ready:{}};
function grams(p, amt){ return p.unit === "adet" ? amt * (p.gpp || 50) : amt; }
function activeOffer(p){ const o = (p.offers || [])[p.active || 0]; return o || null; }
function unitPrice(p){ const o = activeOffer(p); return (o && o.price > 0 && o.pack > 0) ? o.price / o.pack : null; }
function batchWeight(r){ if (r.batch > 0) return r.batch; let g = 0; (r.items || []).forEach(it => { if (it.pid && S.products[it.pid]) g += grams(S.products[it.pid], it.amt || 0); else if (it.rid) g += it.amt || 0; }); return g || 1; }
/* totals for a list of items; rows for display */
function calc(items, depth = 0){
  const T = {p:0, f:0, c:0, cost:0, noPrice:0, rows:[]};
  if (depth > 4) return T;
  (items || []).forEach(it => {
    const amt = it.amt || 0; let row = null;
    if (it.pid){
      const p = S.products[it.pid]; if (!p) { row = {name:"(silinmiş ürün)", amt, unit:"", p:0, f:0, c:0, cost:null}; }
      else {
        const g = grams(p, amt), up = unitPrice(p);
        row = {name:pname(p), amt, unit:UNITS[p.unit] || "g", p:p.p * g / 100, f:p.f * g / 100, c:p.c * g / 100, cost: up == null ? null : up * amt, note:it.note};
      }
    } else if (it.rid){
      const r = S.recipes[it.rid];
      if (!r) row = {name:"(silinmiş reçete)", amt, unit:"g", p:0, f:0, c:0, cost:null};
      else { const t = calc(r.items, depth + 1), k = amt / batchWeight(r);
        row = {name:r.name, amt, unit:"g", p:t.p * k, f:t.f * k, c:t.c * k, cost: t.noPrice ? null : t.cost * k, note:it.note, sub:true}; }
    }
    if (!row) return;
    T.p += row.p; T.f += row.f; T.c += row.c;
    if (row.cost == null) T.noPrice++; else T.cost += row.cost;
    T.rows.push(row);
  });
  T.kcal = T.p * 4 + T.f * 9 + T.c * 4;
  return T;
}
function recipeTotals(rid){ const r = S.recipes[rid]; return r ? calc(r.items) : null; }
/* expand recipe portions to base product amounts */
function expand(rid, mult, acc, depth = 0){
  const r = S.recipes[rid]; if (!r || depth > 4) return acc;
  (r.items || []).forEach(it => {
    if (it.pid) acc[it.pid] = (acc[it.pid] || 0) + (it.amt || 0) * mult;
    else if (it.rid && S.recipes[it.rid]) expand(it.rid, mult * (it.amt || 0) / batchWeight(S.recipes[it.rid]), acc, depth + 1);
  });
  return acc;
}
function dayPlan(i){ return settings().plan[i] || {b:"",l:"",d:""}; }
function dayTotals(i){
  const pl = dayPlan(i), T = {p:0, f:0, c:0, kcal:0, cost:0, noPrice:0};
  MEALS.forEach(([m]) => { const t = pl[m] && recipeTotals(pl[m]); if (t){ T.p += t.p; T.f += t.f; T.c += t.c; T.kcal += t.kcal; T.cost += t.cost; T.noPrice += t.noPrice; } });
  return T;
}
function weekCounts(){ const n = {}; settings().plan.forEach(pl => MEALS.forEach(([m]) => { if (pl[m]) n[pl[m]] = (n[pl[m]] || 0) + 1; })); return n; }
function statusChip(T){
  const t = settings().targets, dp = T.p - t.p, df = T.f - t.f;
  if (T.c > t.c) return `<span class="chip bad">KH fazla</span>`;
  if (Math.abs(dp) <= 10 && Math.abs(df) <= 10) return `<span class="chip ok">Hedefte</span>`;
  return `<span class="chip warn">${dp < -10 ? "Protein az" : dp > 10 ? "Protein fazla" : df < -10 ? "Yağ az" : "Yağ fazla"}</span>`;
}
const pfc = t => `<div class="pfc num"><span class="p"><b>P</b> ${f1(t.p)}</span><span class="f"><b>Y</b> ${f1(t.f)}</span><span class="c"><b>KH</b> ${f1(t.c)}</span><span class="muted">${f0(t.kcal)} kcal</span></div>`;
const sortedRecipes = (filter) => Object.entries(S.recipes).filter(([, r]) => !filter || filter(r)).sort((a, b) => (a[1].order || 99) - (b[1].order || 99) || a[1].name.localeCompare(b[1].name, "tr"));
/* master lists: ürün adları, markalar, tedarikçiler */
const LISTS = {names:["Ürün adları","ürün adı"], brands:["Markalar","marka"], suppliers:["Tedarikçiler","tedarikçi"]};
const L = k => [...((S.lists[k] || {}).items || [])].sort((x, y) => x.name.localeCompare(y.name, "tr"));
const lname = (k, id) => { const x = id && L(k).find(i => i.id === id); return x ? x.name : ""; };
const pname = p => lname("names", p && p.nameId) || (p && p.name) || "(adsız ürün)";
const oBrand = o => o ? (lname("brands", o.brandId) || o.brand || "") : "";
const oSupp = o => o ? (lname("suppliers", o.supplierId) || o.supplier || "") : "";
const trl = v => String(v || "").trim().replace(/\s+/g, " ").toLocaleLowerCase("tr");
const findInList = (k, name) => L(k).find(i => trl(i.name) === trl(name));
function usage(k, id){
  if (k === "names") return Object.values(S.products).filter(p => p.nameId === id).length;
  const f = k === "brands" ? "brandId" : "supplierId";
  return Object.values(S.products).reduce((n, p) => n + (p.offers || []).filter(o => o[f] === id).length, 0);
}
async function addToList(k, name){
  name = String(name || "").trim().replace(/\s+/g, " ").slice(0, 60);
  if (!name) return {err:"Bir ad yaz."};
  const ex = findInList(k, name); if (ex) return {item:ex, existed:true};
  const items = clone(L(k)), item = {id:newId(k[0]), name};
  items.push(item); items.sort((a, b) => a.name.localeCompare(b.name, "tr"));
  await save("lists", k, {items}); return {item};
}
const blankOffer = () => ({brandId:null, supplierId:null, note:"", pack:null, price:null});
const sortedProducts = () => Object.entries(S.products).sort((a, b) => pname(a[1]).localeCompare(pname(b[1]), "tr"));

/* ---------- views ---------- */
function vBugun(){
  const d = fromKey(ui.day), i = dayIdx(d), pl = dayPlan(i), log = S.log[ui.day] || {eaten:{}}, eaten = log.eaten || {};
  const t = settings().targets, rd = settings().ready || {};
  const plan = dayTotals(i), ate = {p:0, f:0, c:0};
  MEALS.forEach(([m]) => { if (eaten[m] && pl[m]){ const x = recipeTotals(pl[m]); if (x){ ate.p += x.p; ate.f += x.f; ate.c += x.c; } } });
  const isToday = ui.day === keyOf(new Date());
  const rail = (k, name) => { const max = Math.max(t[k], plan[k]) * 1.05 || 1;
    return `<div class="mac ${k}"><span class="name">${name}</span><div class="rail"><i class="plan" style="width:${Math.min(100, plan[k] / max * 100)}%"></i><i style="width:${Math.min(100, ate[k] / max * 100)}%"></i></div><span class="v num">${f0(ate[k])} / ${f0(plan[k])} <span class="muted">· ${t[k]}</span></span></div>`; };
  const nxt = dayPlan((i + 1) % 7);
  let h = backupCard() + `<div class="card">
    <div class="row between"><div class="daynav"><button data-act="day" data-d="-1" aria-label="Önceki gün">‹</button><button data-act="day" data-d="1" aria-label="Sonraki gün">›</button></div>
    <div class="grow" style="text-align:center"><div style="font-family:var(--display);font-weight:600;font-size:17px">${DAYS[i]}</div><div class="small muted">${d.getDate()} ${MONTHS[d.getMonth()]}</div></div>
    ${isToday ? `<span class="chip acc">Bugün</span>` : `<button class="sm" data-act="today">Bugün</button>`}</div>
    <div class="macros">${rail("p","Protein")}${rail("f","Yağ")}${rail("c","Net KH")}</div>
    <div class="row between small"><span class="muted">Yenen / plan · hedef (g)</span>${statusChip(plan)}</div>
  </div>`;
  MEALS.forEach(([m, lab]) => {
    const r = S.recipes[pl[m]], x = r && recipeTotals(pl[m]);
    h += `<div class="card meal ${eaten[m] ? "done" : ""}">
      <div class="grow"><div class="label">${lab}</div><h3>${r ? esc(r.name) : "Plan yok"}</h3></div>
      ${r ? `<button class="eat ${eaten[m] ? "on" : ""}" data-act="eat" data-m="${m}">${eaten[m] ? "✓ Yedim" : "Yedim"}</button>` : `<button class="sm" data-act="tab" data-t="plan">Planla</button>`}
      ${x ? `<div style="grid-column:1/-1">${pfc(x)}</div><div class="small muted" style="grid-column:1/-1">Hazır porsiyon: <span class="num">${rd[pl[m]] || 0}</span>${x.noPrice ? "" : ` · Maliyet <span class="num">${tl(x.cost)}</span>`}</div>` : ""}
    </div>`;
  });
  const frozen = [nxt.l, nxt.d].filter(Boolean).map(id => S.recipes[id] && S.recipes[id].name).filter(Boolean);
  if (frozen.length) h += `<div class="card"><div class="label">Bu akşam</div><div>Yarının yemeklerini buzluktan buzdolabına indir: <b>${frozen.map(esc).join(", ")}</b></div></div>`;
  if (i === 6 || i === 2) h += `<div class="card"><div class="label">${i === 6 ? "Pazar · Büyük hazırlık" : "Çarşamba · Kahvaltı hazırlığı"}</div><div>${i === 6 ? "Haftanın yemeklerini pişirme günü." : "Perşembe–Pazar için egg mash hazırla."}</div><button class="primary" data-act="tab" data-t="plan">Hazırlık listesine git</button></div>`;
  return h;
}

function vPlan(){
  const st = settings(), t = st.targets, wc = weekCounts(), rd = st.ready || {};
  const opts = (sel) => `<option value="">—</option>` + sortedRecipes(r => !r.base).map(([id, r]) => `<option value="${esc(id)}" ${id === sel ? "selected" : ""}>${esc(r.name)}</option>`).join("");
  let h = `<h2>Haftalık plan</h2><div class="card" style="padding-block:4px">`;
  for (let i = 0; i < 7; i++){
    const pl = dayPlan(i), T = dayTotals(i);
    h += `<div class="planday"><div class="d">${DAYS3[i]}</div><div style="display:flex;flex-direction:column;gap:6px;min-width:0">
      <div class="sels">${MEALS.map(([m, lab]) => `<label class="pm"><span>${lab}</span><select id="pl-${i}-${m}" aria-label="${DAYS[i]} ${lab}" data-act="plan" data-i="${i}" data-m="${m}">${opts(pl[m])}</select></label>`).join("")}</div>
      <div class="row between small"><span class="num muted">P ${f0(T.p)} · Y ${f0(T.f)} · KH ${f0(T.c)}</span>${statusChip(T)}</div></div></div>`;
  }
  h += `</div>
  <h2>Hazırlık</h2><div class="card"><div class="hint">Pazar büyük hazırlık, Çarşamba akşamı kahvaltılar. Pişirdiğini işaretleyince malzemeler stoktan düşer, porsiyonlar hazıra eklenir. Yedim dedikçe hazırdan düşer.</div><div class="list">`;
  sortedRecipes(r => !r.base).forEach(([id, r]) => {
    const need = wc[id] || 0, have = rd[id] || 0, todo = Math.max(0, need - have);
    if (!need && !have) return;
    h += `<div style="padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px">
      <div class="row between"><div class="grow"><div class="t" style="font-weight:600">${esc(r.name)}</div><div class="small muted num">Hafta ${need} · Hazır ${have} · Pişirilecek ${todo}</div></div>
      <div class="row" style="gap:4px"><button class="sm" data-act="ready" data-r="${esc(id)}" data-d="-1" aria-label="Hazırdan düş">−</button><button class="sm" data-act="ready" data-r="${esc(id)}" data-d="1" aria-label="Hazıra ekle">+</button></div></div>
      ${ui.cook === id ? `<div class="row"><label class="field grow"><span>Kaç porsiyon pişirdin?</span><input id="cook-n" type="text" inputmode="numeric" min="1" step="1" value="${todo || 1}"></label><button class="primary" data-act="cookdo" data-r="${esc(id)}">Kaydet</button><button class="ghost" data-act="cookx">Vazgeç</button></div>`
        : `<button class="sm" data-act="cook" data-r="${esc(id)}" ${todo ? "" : ""}>Pişirdim…</button>`}
    </div>`;
  });
  h += `</div></div>
  <h2>Günlük hedef</h2><div class="card"><div class="grid3">
    <label class="field"><span>Protein (g)</span><input id="t-p" type="text" inputmode="decimal" value="${t.p}"></label>
    <label class="field"><span>Yağ (g)</span><input id="t-f" type="text" inputmode="decimal" value="${t.f}"></label>
    <label class="field"><span>Net KH en fazla (g)</span><input id="t-c" type="text" inputmode="decimal" value="${t.c}"></label></div>
    <div class="row between"><span class="small muted num">≈ ${f0(t.p * 4 + t.f * 9 + t.c * 4)} kcal</span><button class="primary" data-act="targets">Hedefi kaydet</button></div></div>`;
  return h;
}

function vRecete(){
  if (ui.edit && ui.edit.kind === "recipe") return vRecipeEdit();
  let h = `<div class="row between"><h2>Reçeteler</h2><button class="primary sm" data-act="rnew">+ Yeni reçete</button></div><div class="card" style="padding-block:2px"><div class="list">`;
  const rs = sortedRecipes();
  if (!rs.length) h += `<div class="empty">Henüz reçete yok. “Yeni reçete” ile ilkini ekle.</div>`;
  rs.forEach(([id, r]) => { const t = calc(r.items);
    const k = r.base ? batchWeight(r) : 1;
    h += `<button class="li" data-act="redit" data-r="${esc(id)}"><div class="grow"><div class="row" style="gap:6px"><span class="t">${esc(r.name)}</span><span class="chip">${r.base ? "Ara ürün · " + f0(batchWeight(r)) + " g" : MEALNAME[r.meal] || "Öğün"}</span></div>
      <div class="pfc num small" style="margin-top:3px"><span class="p"><b>P</b> ${f1(t.p / k * (r.base ? 100 : 1))}</span><span class="f"><b>Y</b> ${f1(t.f / k * (r.base ? 100 : 1))}</span><span class="c"><b>KH</b> ${f1(t.c / k * (r.base ? 100 : 1))}</span><span class="muted">${r.base ? "/100 g" : f0(t.kcal) + " kcal"}</span></div></div>
      <span class="muted">›</span></button>`; });
  return h + `</div></div>`;
}
function itemOptions(sel){
  return `<optgroup label="Ürünler">` + sortedProducts().map(([id, p]) => `<option value="p:${esc(id)}" ${sel === "p:" + id ? "selected" : ""}>${esc(pname(p))}</option>`).join("") + `</optgroup>`
    + `<optgroup label="Ara ürünler">` + sortedRecipes(r => r.base).filter(([id]) => !ui.edit || id !== ui.edit.id).map(([id, r]) => `<option value="r:${esc(id)}" ${sel === "r:" + id ? "selected" : ""}>${esc(r.name)}</option>`).join("") + `</optgroup>`;
}
function recipePreview(d){
  const t = calc(d.items);
  const k = d.base ? 100 / batchWeight(d) : null;
  return `<div class="tbl"><table><thead><tr><th>Malzeme</th><th>Miktar</th><th>P</th><th>Y</th><th>KH</th><th>₺</th></tr></thead><tbody>`
    + t.rows.map(r => `<tr><td>${esc(r.name)}${r.note ? ` <span class="muted">(${esc(r.note)})</span>` : ""}</td><td class="num">${f1(r.amt)} ${r.unit}</td><td class="num">${f1(r.p)}</td><td class="num">${f1(r.f)}</td><td class="num">${f1(r.c)}</td><td class="num">${r.cost == null ? "–" : tl(r.cost)}</td></tr>`).join("")
    + `</tbody><tfoot><tr><td>${d.base ? "Parti toplamı" : "Porsiyon"}</td><td class="num">${f0(t.kcal)} kcal</td><td class="num">${f1(t.p)}</td><td class="num">${f1(t.f)}</td><td class="num">${f1(t.c)}</td><td class="num">${t.noPrice ? "–" : tl(t.cost)}</td></tr>`
    + (k ? `<tr><td>100 g başına</td><td></td><td class="num">${f1(t.p * k)}</td><td class="num">${f1(t.f * k)}</td><td class="num">${f1(t.c * k)}</td><td class="num">${t.noPrice ? "–" : tl(t.cost * k)}</td></tr>` : "")
    + `</tfoot></table></div>${t.noPrice ? `<div class="hint">${t.noPrice} malzemenin fiyatı girilmemiş; maliyet eksik.</div>` : ""}`;
}

    + (adding ? `<div class="row" style="gap:6px;margin-top:6px"><input id="${id}-new" placeholder="Yeni ${LISTS[k][1]}" value="${esc(ui.adding.text || "")}" data-f="addtext" style="flex:1 1 100%"><button class="sm primary" data-act="addlist">Ekle</button><button class="sm ghost" data-act="addx">Vazgeç</button></div>` : "");
}

      <div class="row between"><label class="row" style="gap:6px;font-weight:600"><input type="radio" name="act" id="po-${n}-act" data-act="pactive" data-i="${n}" ${n === (d.active || 0) ? "checked" : ""} style="width:auto;min-height:0">Kullanılan</label>

function vLists(){
  let h = `<div class="row between"><button class="ghost" data-act="listsback">‹ Ürünler</button><span class="label">Listeler</span></div>
  <div class="hint">Ürün adı, marka ve tedarikçi sadece bu listelerden seçilir. Yeni bir tane gelirse buradan veya seçim kutusundaki “+ Yeni … ekle” ile eklersin. Adı düzeltince her yerde değişir; kullanılan bir kayıt silinemez.</div>`;
  Object.entries(LISTS).forEach(([k, [title, one]]) => {
    const items = L(k);
    h += `<h2>${title} <span class="muted small num">${items.length}</span></h2><div class="card" style="gap:6px">`;
    if (!items.length) h += `<div class="small muted">Henüz ${one} yok.</div>`;
    items.forEach(x => { const n = usage(k, x.id), key = k + ":" + x.id;
      if (ui.ren && ui.ren.k === k && ui.ren.id === x.id) h += `<div class="row" style="gap:6px;flex-wrap:nowrap"><input id="ren-${esc(x.id)}" data-f="rentext" value="${esc(ui.ren.text)}" style="flex:1"><button class="sm primary" data-act="lrensave">Kaydet</button><button class="sm ghost" data-act="lrenx">Vazgeç</button></div>`;
      else h += `<div class="row" style="gap:6px;flex-wrap:nowrap;min-height:40px;border-bottom:1px solid var(--line);padding-bottom:6px"><span class="grow">${esc(x.name)}</span><span class="chip">${n ? (k === "names" ? "kullanılıyor" : n + " yerde") : "kullanılmıyor"}</span>
        <button class="sm ghost" data-act="lren" data-k="${k}" data-id="${esc(x.id)}">Düzenle</button>
        <button class="sm ${ui.armed === key ? "danger armed" : "ghost"}" data-act="ldel" data-k="${k}" data-id="${esc(x.id)}" aria-label="${esc(x.name)} sil">${ui.armed === key ? "Sil?" : "✕"}</button></div>`;
    });
    h += `<div class="row" style="gap:6px;flex-wrap:nowrap;margin-top:4px"><input id="new-${k}" placeholder="Yeni ${one}" style="flex:1" data-f="newtext" data-k="${k}"><button class="sm" data-act="ladd" data-k="${k}">Ekle</button></div></div>`;

function shoppingRows(){
  const wc = weekCounts(), rd = settings().ready || {}, acc = {};
  Object.entries(wc).forEach(([rid, n]) => { const todo = Math.max(0, n - (rd[rid] || 0)); if (todo) expand(rid, todo, acc); });
  return Object.entries(acc).filter(([pid]) => S.products[pid]).map(([pid, need]) => {
    const p = S.products[pid], stock = p.stock || 0, buy = Math.max(0, need - stock), o = activeOffer(p), up = unitPrice(p);
    const packs = (o && o.pack > 0 && buy > 0) ? Math.ceil(buy / o.pack) : null;
    const cost = buy <= 0 ? 0 : packs != null && o.price > 0 ? packs * o.price : up != null ? up * buy : null;
    return {pid, p, need, stock, buy, packs, cost, o};
  }).sort((a, b) => (b.buy > 0) - (a.buy > 0) || pname(a.p).localeCompare(pname(b.p), "tr"));
}
function fmtAmt(p, x){ return p.unit === "adet" ? f0(Math.ceil(x - 1e-9)) + " adet" : x >= 1000 ? f1(x / 1000) + (p.unit === "ml" ? " L" : " kg") : f0(x) + " " + UNITS[p.unit]; }
function vListe(){
  const rows = shoppingRows(), buy = rows.filter(r => r.buy > 0);
  const total = buy.reduce((s, r) => s + (r.cost || 0), 0), missing = buy.filter(r => r.cost == null).length;
  let h = `<h2>Alışveriş listesi</h2>
  <div class="card"><div class="row between"><div><div class="label">Tahmini tutar</div><div class="big num">${tl0(total)}</div></div>
    <button data-act="copylist" ${buy.length ? "" : "disabled"}>Listeyi kopyala</button></div>
    <div class="hint">Haftalık plandan, hazır porsiyonlar ve evdeki stok düşülerek hesaplandı.${missing ? ` ${missing} ürünün fiyatı yok, tutara dahil değil.` : ""}</div></div>
  <div class="card" style="padding-block:2px"><div class="list">`;
  if (!rows.length) h += `<div class="empty">Planda pişirilecek yemek yok.</div>`;
  rows.forEach(r => {
    const brand = r.o && [oBrand(r.o), oSupp(r.o)].filter(Boolean).join(" · ");
    h += `<div class="li" style="cursor:default"><div class="grow"><div class="t">${esc(pname(r.p))}</div>
      <div class="small muted num">Gerekli ${fmtAmt(r.p, r.need)} · Evde ${fmtAmt(r.p, r.stock)}${brand ? " · " + esc(brand) : ""}</div></div>
      ${r.buy > 0 ? `<div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="num" style="font-weight:600">${r.packs != null ? r.packs + " paket" : fmtAmt(r.p, r.buy)}</span>
        <span class="small num muted">${r.cost == null ? "fiyat yok" : tl(r.cost)}</span><button class="sm" data-act="bought" data-p="${esc(r.pid)}">Aldım</button></div>`
      : `<span class="chip ok">Evde var</span>`}</div>`;
  });
  return h + `</div></div><div class="hint">“Aldım” dediğinde alınan miktar stoğa eklenir. Brokoliyi saplı alıyorsan ayıklanmış miktarın yaklaşık 1,45 katını al.</div>`;
}

function vMaliyet(){
  const wc = weekCounts();
  let week = 0, missing = new Set();
  for (let i = 0; i < 7; i++){ const T = dayTotals(i); week += T.cost; }
  sortedRecipes(r => !r.base).forEach(([id]) => { const t = recipeTotals(id); if (wc[id] && t.noPrice) t.rows.forEach(x => { if (x.cost == null) missing.add(x.name); }); });
  let h = `<h2>Maliyet</h2>
  <div class="card"><div class="stats">
    <div><span class="label">Günlük ort.</span><span class="big num" style="font-size:22px">${tl0(week / 7)}</span></div>
    <div><span class="label">Haftalık</span><span class="big num" style="font-size:22px">${tl0(week)}</span></div>
    <div><span class="label">Aylık (30 gün)</span><span class="big num" style="font-size:22px">${tl0(week / 7 * 30)}</span></div></div>
    ${missing.size ? `<div class="hint">Fiyatı olmayan malzemeler hesaba katılmadı: ${[...missing].map(esc).join(", ")}. <button class="ghost sm" data-act="tab" data-t="urun">Fiyat gir</button></div>` : `<div class="hint">Tüm malzemelerin fiyatı girilmiş.</div>`}</div>
  <div class="card"><div class="label">Porsiyon başına</div><div class="tbl"><table><thead><tr><th>Reçete</th><th>Haftada</th><th>Porsiyon</th><th>Hafta</th></tr></thead><tbody>`;
  sortedRecipes(r => !r.base).forEach(([id, r]) => { const t = recipeTotals(id), n = wc[id] || 0;

function chart(ws){
  const W = 600, H = 220, L = 44, R = 14, T = 14, B = 28;
  const xs = ws.map(([k]) => fromKey(k).getTime()), ys = ws.map(([, w]) => w.kg);
  let x0 = Math.min(...xs), x1 = Math.max(...xs); if (x1 === x0){ x0 -= 864e5 * 3; x1 += 864e5 * 3; }
  let y0 = Math.floor(Math.min(...ys) - 0.5), y1 = Math.ceil(Math.max(...ys) + 0.5);
  const sx = x => L + (x - x0) / (x1 - x0) * (W - L - R), sy = y => T + (y1 - y) / (y1 - y0) * (H - T - B);
  const step = Math.max(1, Math.ceil((y1 - y0) / 4));
  let g = "";
  for (let y = y0; y <= y1; y += step) g += `<line x1="${L}" x2="${W - R}" y1="${sy(y)}" y2="${sy(y)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 8}" y="${sy(y) + 4}" text-anchor="end" font-size="12" fill="var(--muted)" font-family="var(--mono)">${y}</text>`;
  const pts = ws.map(([k, w]) => [sx(fromKey(k).getTime()), sy(w.kg)]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = line + ` L ${pts[pts.length - 1][0].toFixed(1)} ${H - B} L ${pts[0][0].toFixed(1)} ${H - B} Z`;
  const fd = k => { const d = fromKey(k); return d.getDate() + " " + MONTHS[d.getMonth()].slice(0, 3); };
  const lp = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kilo grafiği">${g}
    <path d="${area}" fill="var(--accent)" fill-opacity=".12" stroke="none"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="var(--accent)"/>`).join("")}
    <circle cx="${lp[0].toFixed(1)}" cy="${lp[1].toFixed(1)}" r="6" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/>
    <text x="${L}" y="${H - 8}" font-size="12" fill="var(--muted)" font-family="var(--mono)">${fd(ws[0][0])}</text>
    <text x="${W - R}" y="${H - 8}" font-size="12" fill="var(--muted)" text-anchor="end" font-family="var(--mono)">${fd(ws[ws.length - 1][0])}</text></svg>`;
}

const SCAN_PROMPT = `Bu fotoğraflar bir gıda ürününün ambalajından: besin değerleri tablosu, barkod, ön yüz veya bunların bir kısmı olabilir. Okuyabildiğin bilgileri çıkar.
Yalnızca şu biçimde tek bir JSON nesnesi döndür:
{"name": string|null, "brand": string|null, "barcode": string|null, "unit": "g"|"ml"|"adet"|null, "pack": number|null, "per100": {"kcal": number|null, "protein": number|null, "fat": number|null, "carbs": number|null, "fiber": number|null}|null, "carbsIncludesFiber": boolean, "confidence": "high"|"low", "note": string|null}
Kurallar:
- name: ürünün kısa Türkçe genel adı (örn. "Laktozsuz kaşar", "Dana kıyma"); marka adını buraya yazma.
- barcode: barkodun altındaki rakamlar, boşluksuz (EAN-13, EAN-8 veya UPC). Okuyamıyorsan null; rakam uydurma.
- pack: paketteki net miktar unit cinsinden ("400 g" → 400, "1 L" → 1000 ve unit "ml", "30'lu yumurta" → 30 ve unit "adet").
- per100: 100 g veya 100 ml başına değerler. Tabloda yalnızca porsiyon başına değer varsa 100'e çevir. Sayıları ondalık nokta ile yaz.
- Türkiye ve AB etiketlerinde "Karbonhidrat" satırı lifi içermez: carbsIncludesFiber=false. ABD tipi "Total Carbohydrate" ise true.
- Okuyamadığın her alanı null bırak, tahmin etme. Yazılar bulanıksa confidence "low" olsun ve note'ta kısaca söyle.`;
const normBc = v => { const d = String(v || "").replace(/\D/g, ""); return d.length >= 8 && d.length <= 14 ? d : null; };
const bcMatch = (o, bc) => !!bc && (o.barcode === bc || (!!o.wprefix && bc.length === 13 && bc.startsWith(o.wprefix)));
function findByBarcode(bc){ for (const [id, p] of Object.entries(S.products)) if ((p.offers || []).some(o => bcMatch(o, bc))) return id; return null; }
function blankProduct(){ return {nameId:null, unit:"g", p:null, f:null, c:null, stock:0, offers:[blankOffer()], active:0}; }
function applyRead(d, read, isNew, selfId){
  const ch = [], sugg = {}, n = v => (typeof v === "number" && isFinite(v) && v >= 0) ? r1(v) : null;
  if (isNew && ["g","ml","adet"].includes(read.unit)){ d.unit = read.unit; if (d.unit === "adet" && !d.gpp) d.gpp = 50; }
  if (!d.nameId && read.name){
    const m = findInList("names", read.name), taken = m && Object.entries(S.products).some(([id, p]) => id !== selfId && p.nameId === m.id);
    if (m && !taken){ d.nameId = m.id; ch.push("Ad: " + m.name); } else if (!m) sugg.name = String(read.name).trim().slice(0, 60);
  }
  const per = read.per100 || {};
  const pp = n(per.protein), ff = n(per.fat);
  let cc = n(per.carbs); if (cc != null && read.carbsIncludesFiber && n(per.fiber) != null) cc = r1(Math.max(0, cc - n(per.fiber)));
  [["p","Protein",pp],["f","Yağ",ff],["c","Net KH",cc]].forEach(([k, lab, v]) => {
    if (v == null) return; if (d[k] !== v) ch.push(lab + ": " + (d[k] == null ? "boş" : f1(d[k])) + " → " + f1(v)); d[k] = v; });
  d.offers = d.offers && d.offers.length ? d.offers : [blankOffer()];
  const bc = normBc(read.barcode), brand = read.brand ? String(read.brand).trim().slice(0, 60) : "", pack = n(read.pack);
  const bm = brand ? findInList("brands", brand) : null;
  let i = bc ? d.offers.findIndex(o => bcMatch(o, bc)) : -1;
  if (i < 0){
    const a = d.active || 0, ao = d.offers[a], ab = oBrand(ao);
    if (!bc || (!ao.barcode && (!ab || !brand || trl(ab) === trl(brand)))) i = a;
    else { d.offers.push(blankOffer()); i = d.offers.length - 1; ch.push("Yeni marka/tedarikçi satırı eklendi"); }
  }
  const o = d.offers[i];
  if (bc && !bcMatch(o, bc)){ o.barcode = bc; ch.push("Barkod: " + bc); }
  if (brand && !oBrand(o)){ if (bm){ o.brandId = bm.id; ch.push("Marka: " + bm.name); } else { sugg.brand = brand; sugg.offer = i; } }
  if (pack && !o.pack){ o.pack = pack; ch.push("Paket: " + f1(pack) + " " + (UNITS[d.unit] || "g")); }
  ch.sugg = sugg;
  return ch;
}
function handleRead(read, modeKind){
  if (!read || typeof read !== "object" || Array.isArray(read)){ ui.scan = {status:"error", msg:"Etiket okunamadı. Daha net bir fotoğrafla tekrar dene."}; render(); return; }
  const per = read.per100 || {}, hasNut = [per.protein, per.fat, per.carbs].some(v => typeof v === "number"), bc = normBc(read.barcode);
  if (!hasNut && !bc){ ui.scan = {status:"error", msg:"Fotoğrafta besin değerleri tablosu veya barkod okunamadı. Tabloyu ya da barkodu yakından, düz açıyla çek."}; render(); return; }
  const meta = {confidence:read.confidence, note:read.note};
  if (modeKind === "edit" && ui.edit && ui.edit.kind === "product"){
    const ch = applyRead(ui.edit.draft, read, ui.edit.isNew, ui.edit.id);
    ui.edit.scan = {...meta, changes:ch, sugg:ch.sugg, kind:"fill"};
  } else {
    const match = bc && findByBarcode(bc);
    if (match){ const d = clone(S.products[match]); const ch = applyRead(d, read, false, match); ui.edit = {kind:"product", isNew:false, id:match, draft:d, scan:{...meta, changes:ch, sugg:ch.sugg, kind:"matched"}}; }
    else { const nid = newId("p"), d = blankProduct(); const ch = applyRead(d, read, true, nid); ui.edit = {kind:"product", isNew:true, id:nid, draft:d, scan:{...meta, changes:ch, sugg:ch.sugg, kind:"new", read}}; }
  }
  ui.tab = "urun"; ui.armed = null; render(); window.scrollTo(0, 0);
}
async function toB64(file){
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1568 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.85).split(",")[1];
}
function parseJsonLoose(t){
  try { return JSON.parse(t); } catch(e){}
  const m = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (m){ try { return JSON.parse(m[1]); } catch(e){} }
  const a = t.indexOf("{"), b = t.lastIndexOf("}"); if (a >= 0 && b > a){ try { return JSON.parse(t.slice(a, b + 1)); } catch(e){} }
  throw {kind:"json"};
}
async function apiRead(files, signal){
  const imgs = [];
  for (const f of files){ let data; try { data = await toB64(f); } catch(e){ throw {kind:"image"}; } imgs.push({type:"image", source:{type:"base64", media_type:"image/jpeg", data}}); }
  const res = await fetch("https://api.anthropic.com/v1/messages", {method:"POST", signal,
    headers:{"content-type":"application/json", "x-api-key":ai.key, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:API_MODEL, max_tokens:1024, messages:[{role:"user", content:[...imgs, {type:"text", text:SCAN_PROMPT + "\nYanıtında JSON dışında hiçbir şey olmasın."}]}]})});
  if (!res.ok){ let msg = ""; try { const j = await res.json(); msg = (j.error && j.error.message) || ""; } catch(e){} throw {kind:"http", status:res.status, msg}; }
  const j = await res.json();
  return parseJsonLoose((j.content || []).filter(b => b.type === "text").map(b => b.text).join(""));
}
async function runScan(files, modeKind){
  if (!files.length) return;
  if (!ai.key){ toast("Önce Ayarlar'dan API anahtarını gir."); goTab("ayar"); return; }
  const ctl = new AbortController(); ui.scan = {status:"reading", ctl}; render();
  try {
    const read = await apiRead(files, ctl.signal);
    if (ctl.signal.aborted || !ui.scan || ui.scan.ctl !== ctl) return;
    ui.scan = null; handleRead(read, modeKind);
  } catch(e){
    if (ctl.signal.aborted || !ui.scan || ui.scan.ctl !== ctl) return;
    if (e && e.name === "AbortError"){ ui.scan = null; render(); return; }
    let msg = "İnternet bağlantısı yok ya da istek ulaşmadı. Tekrar dene.";
    if (e && e.kind === "json") msg = "Etiket okunamadı. Daha net bir fotoğrafla tekrar dene.";
    else if (e && e.kind === "image") msg = "Fotoğraf açılamadı. Başka bir fotoğraf dene.";
    else if (e && e.kind === "http"){
      const m = (e.msg || "").toLowerCase();
      if (e.status === 401 || e.status === 403) msg = "API anahtarı geçersiz ya da yetkisiz. Ayarlar'dan kontrol et.";
      else if (m.includes("credit") || m.includes("billing")) msg = "API hesabında kredi yok. console.anthropic.com → Billing'den kredi yükle.";
      else if (e.status === 429) msg = "Çok sık deneme yapıldı ya da limit doldu. Biraz sonra tekrar dene.";
      else if (e.status >= 500) msg = "Servis şu an yoğun. Biraz sonra tekrar dene.";
      else msg = "İstek reddedildi (" + e.status + ")" + (e.msg ? ": " + e.msg : "") + ".";
    }
    ui.scan = {status:"error", msg}; render();
  }
}

function readBackupFile(file){

  if (e.key !== "Enter") return; const f = e.target.dataset && e.target.dataset.f;
  const act = f === "addtext" ? "addlist" : f === "rentext" ? "lrensave" : f === "newtext" ? "ladd" : null; if (!act) return;
  e.preventDefault(); const t = e.target; if (act !== "ladd") t.blur(); Promise.resolve(A[act](t)).catch(err => console.error(err));
});
$("#restore-in").addEventListener("change", e => { const f = e.target.files && e.target.files[0]; if (f) readBackupFile(f); });
$("#photo-in").addEventListener("change", e => {
  const files = [...(e.target.files || [])].slice(0, ai.maxCount);
  if (files.length) runScan(files, ui.photoMode === "edit" && ui.edit ? "edit" : "list");
});

/* ---------- boot ---------- */
(function init(){
  try { const t = localStorage.getItem("mealflow-tab"); if (t && (TABS.some(x => x[0] === t) || t === "ayar")) ui.tab = t; } catch(e){}
  backend = localBackend(); mode = "local";
  COLLS.forEach(c => backend.sub(c, obj => { S[c] = obj; loaded.add(c); schedule(); }));
  render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
